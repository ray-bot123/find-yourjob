services:
  - type: web
    name: find-yourjob
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "4175"
      - key: FYJ_AI_URL
        sync: false
      - key: FYJ_AI_MODEL
        sync: false
      - key: FYJ_AI_KEY
        sync: false
      - key: FYJ_AI_PROVIDER
        sync: false
      - key: FYJ_ADZUNA_APP_ID
        sync: false
      - key: FYJ_ADZUNA_APP_KEY
        sync: false
      - key: FYJ_PAYPAL_CLIENT_ID
        sync: false
      - key: FYJ_PAYPAL_CLIENT_SECRET
        sync: false
      - key: FYJ_PAYPAL_PLAN_ID
        sync: false
